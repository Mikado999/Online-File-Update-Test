<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto-Updating App</title>
<style>
  body { font-family: sans-serif; padding: 2rem; background: #f4f4f4; }
  #status { margin-top: 1rem; font-weight: bold; }
  #data { margin-top: 1rem; white-space: pre-wrap; background: #fff; padding: 1rem; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1);}
</style>
</head>
<body>
<h1>Auto-Updating App</h1>
<div id="status">Initializing...</div>
<div id="data"></div>

<script>
/* ================= CONFIG ================= */
const GITHUB_REPO = 'Mikado999/Online-File-Update-Test';
const FILE_PATH = 'index.html';
const BRANCH = 'main';
const RAW_URL = `https://raw.githubusercontent.com/${GITHUB_REPO}/${BRANCH}/${FILE_PATH}`;
const GITHUB_TOKEN = ''; // optional: for push updates
const CHECK_INTERVAL = 30000; // check for updates every 30 seconds
/* ========================================== */

/* ================= LOCAL DATA ================= */
let appData = JSON.parse(localStorage.getItem('appData') || '{"runs":0,"version":1}');
const status = document.getElementById('status');
const dataDiv = document.getElementById('data');

/* ================= SHOW LOCAL DATA ================= */
function showData() {
  dataDiv.textContent = JSON.stringify(appData, null, 2);
}

/* ================= UPDATE LOCAL DATA ================= */
function updateLocalData() {
  appData.runs += 1;
  localStorage.setItem('appData', JSON.stringify(appData));
  status.textContent = `Runs: ${appData.runs}, Version: ${appData.version}`;
  showData();
}

/* ================= SELF-UPDATE FUNCTION ================= */
async function checkForUpdates() {
  try {
    const res = await fetch(RAW_URL);
    if (!res.ok) throw new Error('GitHub fetch failed');
    const remoteHTML = await res.text();

    // Parse version from remote file
    const match = remoteHTML.match(/"version":\s*(\d+)/);
    if (!match) return;
    const remoteVersion = parseInt(match[1]);

    if (remoteVersion > appData.version) {
      console.log(`New version detected: ${remoteVersion}`);
      status.textContent = `Updating to version ${remoteVersion}...`;

      // Replace the page content
      document.open();
      document.write(remoteHTML);
      document.close();

      // Update local version after reload
      localStorage.setItem('appData', JSON.stringify({...appData, version: remoteVersion}));
    }
  } catch (err) {
    console.error('Update check failed:', err);
    status.textContent = 'Could not check for updates';
  }
}

/* ================= OPTIONAL PUSH FUNCTION ================= */
async function pushToGitHub() {
  if (!GITHUB_TOKEN) return; // read-only
  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${FILE_PATH}`;
    const r = await fetch(apiUrl, { headers: { Authorization: `token ${GITHUB_TOKEN}` } });
    if (!r.ok) return;
    const sha = (await r.json()).sha;

    const content = btoa(unescape(encodeURIComponent(document.documentElement.outerHTML)));
    const payload = {
      message: `Auto update (runs: ${appData.runs})`,
      content,
      sha,
      branch: BRANCH
    };
    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (putRes.ok) console.log('GitHub push successful');
  } catch (err) {
    console.error('GitHub push failed:', err);
  }
}

/* ================= MAIN LOOP ================= */
updateLocalData();
checkForUpdates();

// Periodically check for updates in the background
setInterval(checkForUpdates, CHECK_INTERVAL);

// Optional: auto-push after 10s
if (GITHUB_TOKEN) setTimeout(pushToGitHub, 10000);

</script>

<!-- ================= DATA BLOCK ================= -->
<script type="application/json" id="appData">
{
  "runs": 0,
  "version": 1
}
</script>
